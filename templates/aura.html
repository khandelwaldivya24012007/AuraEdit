<!DOCTYPE html>
<html>
<head>
    <title>AuraEdit</title>
    <link rel="stylesheet" href="/static/aura.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap" rel="stylesheet">
</head>

<body>
    

<!-- 🔥 INTRO -->
<div id="intro">
    <div class="fire"></div>
    <h1 class="logo">AURA EDIT</h1>
     
</div>

<!-- 🩸 MAIN -->
<div id="main" style="display:none;">

    <h2 class="title">Choose Your Creation</h2>

<div class="card-container">
    <div class="card stark">
        <span class="text-content">Text → Story</span>
    </div>
    <div class="card targaryen">
        <span class="text-content">Photo → Story</span>
    </div>
    <div class="card lannister">
        <span class="text-content">AI Reel Generator</span>
    </div>
    <div class="card tyrell">
        <span class="text-content">Personal Magazine</span>
    </div>
    <div class="card baratheon">
        <span class="text-content">Template Designer</span>
    </div>
    <div class="card martell">
        <span class="text-content">Assignment Maker</span>
    </div>
</div>
        

</div>
<div id="transition-overlay">
    <div class="transition-content">
        <h1 id="transition-title"></h1>
        <h2 id="transition-subtitle"></h2>
    </div>
</div>

<script src="/static/aura.js"></script>

</body>
</html>
